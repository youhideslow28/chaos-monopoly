name: "Schedule 1 — Daily CI & Full Test Suite"

on:
  schedule:
    # Chạy định kỳ mỗi ngày lúc 00:00 UTC (07:00 sáng giờ Việt Nam)
    - cron: '0 0 * * *'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: "Typecheck, Build & Full Vitest Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js 22 (with Native SQLite support)"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: "Install Dependencies"
        run: npm ci

      - name: "TypeScript Strict Typecheck & Production Bundle Build"
        run: npm run build

      - name: "Execute Full Unit, Integration & E2E Domain Tests"
        run: npx vitest run --exclude "src/game/__tests__/phase03_simulation_benchmark.test.ts" --exclude "src/game/__tests__/world_balance_m2.test.ts"
